<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-app: #F4F6F4;
    --bg-sidebar: #FFFFFF;
    --bg-panel: #FFFFFF;
    --bg-hover: #EEF5F0;
    --bg-active: #E4F8EB;
    --border-color: #DEE3DE;
    --border-strong: #C7CDC7;
    --text-primary: #171A17;
    --text-secondary: #55605A;
    --text-tertiary: #93A096;
    --accent: #03C75A;
    --accent-hover: #02A34A;
    --accent-soft: #E4F8EB;
    --accent-contrast: #FFFFFF;
    --danger: #E6483C;
    --danger-soft: #FCEAE8;
    --shadow-sm: 0 1px 2px rgba(23, 26, 23, 0.06);
    --shadow-md: 0 8px 24px rgba(23, 26, 23, 0.09);
    --shadow-lg: 0 24px 56px rgba(23, 26, 23, 0.2);
    --radius-sm: 9px;
    --radius-md: 13px;
    --radius-lg: 18px;
    --transition: 160ms cubic-bezier(0.4, 0, 0.2, 1);
    --sidebar-w: 260px;
    --list-w: 320px;
  }

  [data-theme="dark"] {
    --bg-app: #0E100E;
    --bg-sidebar: #17191A;
    --bg-panel: #1A1C1B;
    --bg-hover: #232624;
    --bg-active: #123322;
    --border-color: #2C302D;
    --border-strong: #3C413D;
    --text-primary: #F3F5F3;
    --text-secondary: #97A198;
    --text-tertiary: #5C6660;
    --accent: #2ED76E;
    --accent-hover: #56E38B;
    --accent-soft: #16281C;
    --accent-contrast: #05130A;
    --danger: #FF6E63;
    --danger-soft: #2E1917;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Pretendard', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-app);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
    border: none;
    background: none;
    cursor: pointer;
    color: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  input, textarea, select { font-family: inherit; color: inherit; outline: none; }
  ::selection { background: var(--accent-soft); }

  svg.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; display: block; }

  .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    transition: transform var(--transition);
    z-index: 40;
  }

  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px 8px; }

  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-contrast);
    flex-shrink: 0;
  }

  .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }

  .new-note-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px 14px;
    background: var(--accent); color: var(--accent-contrast);
    border-radius: var(--radius-md);
    font-weight: 700; font-size: 14px;
    transition: background var(--transition), transform var(--transition);
  }

  .new-note-btn:hover { background: var(--accent-hover); }
  .new-note-btn:active { transform: scale(0.98); }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 10px 12px;
    background: var(--bg-app);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
  }

  .search-box svg { color: var(--text-tertiary); width: 16px; height: 16px; }
  .search-box input { border: none; background: none; width: 100%; font-size: 13.5px; }
  .search-box input::placeholder { color: var(--text-tertiary); }

  .sidebar-nav { margin-top: 20px; display: flex; flex-direction: column; gap: 2px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 10px; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
    transition: background var(--transition), color var(--transition);
    justify-content: space-between;
  }

  .nav-item-left { display: flex; align-items: center; gap: 10px; }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--bg-active); color: var(--accent); }
  .nav-count { font-size: 11.5px; color: var(--text-tertiary); font-weight: 600; }

  .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-color); }

  .list-panel {
    width: var(--list-w); flex-shrink: 0;
    background: var(--bg-app);
    border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .list-header { padding: 22px 20px 14px 20px; display: flex; align-items: center; gap: 10px; }
  .list-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .list-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; font-weight: 500; }

  .mobile-menu-btn, .mobile-back-btn {
    display: none; padding: 7px; border-radius: var(--radius-sm);
    background: var(--bg-hover); border: 1px solid var(--border-color); color: var(--text-primary);
  }

  .note-list {
    flex: 1; overflow-y: auto; padding: 0 10px 16px 10px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .note-list::-webkit-scrollbar { width: 6px; }
  .note-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

  .note-item {
    padding: 15px 14px; border-radius: var(--radius-md); cursor: pointer;
    transition: background var(--transition), box-shadow var(--transition);
    position: relative;
    background: var(--bg-panel);
    box-shadow: var(--shadow-sm);
  }

  .note-item:hover { box-shadow: var(--shadow-md); }
  .note-item.active { background: var(--accent-soft); box-shadow: none; border: 1.5px solid var(--accent); }
  .note-item.active { padding: 13.5px 12.5px; }

  .note-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

  .note-item-title {
    font-size: 14.5px; font-weight: 700; color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }

  .note-item-star {
    color: var(--text-tertiary); flex-shrink: 0;
    transition: color var(--transition), transform var(--transition);
    width: 22px; height: 22px;
  }

  .note-item-star.starred { color: #F5B400; }
  .note-item-star:hover { transform: scale(1.12); }
  .note-item-star svg { width: 15px; height: 15px; }
  .note-item-star.starred svg { fill: #F5B400; }

  .note-item-preview {
    font-size: 12.5px; color: var(--text-secondary); margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .note-item-date { font-size: 11px; color: var(--text-tertiary); margin-top: 9px; font-weight: 500; }

  .empty-list {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 60px 24px; color: var(--text-tertiary); gap: 10px;
  }

  .empty-list svg { width: 36px; height: 36px; opacity: 0.4; }
  .empty-list-title { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
  .empty-list-sub { font-size: 12px; max-width: 200px; }

  .editor-panel {
    flex: 1; display: flex; flex-direction: column;
    background: var(--bg-panel); overflow: hidden; min-width: 0;
  }

  .editor-header { padding: 18px 32px 0 32px; display: flex; flex-direction: column; gap: 10px; }
  .editor-header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .editor-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .save-status {
    font-size: 12px; color: var(--text-tertiary); font-weight: 500;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }

  .save-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-tertiary); transition: background var(--transition);
  }

  .save-status.saving .dot { background: #F5B400; }
  .save-status.saved .dot { background: var(--accent); }

  .editor-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: var(--bg-hover);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }

  .icon-btn:hover { background: var(--border-color); border-color: var(--border-strong); }
  .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-soft); }
  .icon-btn.active-toggle { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .icon-btn.active-toggle svg { fill: var(--accent); }

  .title-input {
    border: none; font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
    background: none; width: 100%;
  }

  .title-input::placeholder { color: var(--text-tertiary); }

  .toolbar {
    display: flex; align-items: center; gap: 2px;
    padding: 10px 32px; border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap; row-gap: 6px;
  }

  .toolbar-divider { width: 1px; height: 20px; background: var(--border-color); margin: 0 6px; }

  .toolbar-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--bg-hover);
    color: var(--text-primary);
    transition: background var(--transition), color var(--transition);
  }

  .toolbar-btn:hover { background: var(--border-color); }
  .toolbar-btn.is-active { background: var(--accent-soft); color: var(--accent); }

  .editor-scroll { flex: 1; overflow-y: auto; padding: 24px 32px 40px 32px; }
  .editor-scroll::-webkit-scrollbar { width: 8px; }
  .editor-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .content-editable { min-height: 100%; font-size: 15.5px; line-height: 1.85; outline: none; max-width: 760px; }
  .content-editable:empty::before { content: attr(data-placeholder); color: var(--text-tertiary); }

  .content-editable h1 { font-size: 24px; font-weight: 800; margin: 18px 0 8px; letter-spacing: -0.01em; }
  .content-editable h2 { font-size: 19px; font-weight: 700; margin: 16px 0 6px; }
  .content-editable p { margin: 6px 0; }
  .content-editable ul, .content-editable ol { padding-left: 22px; margin: 8px 0; }
  .content-editable li { margin: 3px 0; }
  .content-editable blockquote {
    border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; margin: 12px 0;
    color: var(--text-secondary); font-style: italic;
  }
  .content-editable pre {
    background: var(--bg-app); border: 1px solid var(--border-color);
    border-radius: var(--radius-sm); padding: 12px 14px; margin: 10px 0;
    overflow-x: auto; font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
  }
  .content-editable a { color: var(--accent); text-decoration: underline; }

  .editor-meta {
    padding: 12px 32px 16px 32px; border-top: 1px solid var(--border-color);
    display: flex; gap: 18px; flex-wrap: wrap;
  }

  .meta-item {
    font-size: 11.5px; color: var(--text-tertiary); font-weight: 500;
    display: flex; align-items: center; gap: 5px;
  }

  .meta-item svg { width: 13px; height: 13px; }

  .empty-editor {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--text-tertiary); padding: 40px;
  }

  .empty-editor-icon {
    width: 72px; height: 72px; border-radius: 22px;
    background: var(--bg-app); display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary);
  }

  .empty-editor-icon svg { width: 32px; height: 32px; }
  .empty-editor-title { font-size: 16px; font-weight: 700; color: var(--text-secondary); }
  .empty-editor-sub { font-size: 13px; text-align: center; max-width: 260px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(9, 12, 16, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; opacity: 0; pointer-events: none;
    transition: opacity var(--transition);
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-box {
    background: var(--bg-panel); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); width: 100%; max-width: 420px;
    max-height: 88vh; overflow-y: auto;
    transform: translateY(8px) scale(0.98);
    transition: transform var(--transition);
  }

  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
  .modal-box.wide { max-width: 520px; }

  .modal-header {
    padding: 22px 22px 0 22px; display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px;
  }

  .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .modal-body { padding: 14px 22px 22px 22px; }
  .modal-desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

  .btn {
    padding: 11px 18px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 700;
    transition: background var(--transition), transform var(--transition);
  }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { background: var(--bg-hover); color: var(--text-primary); }
  .btn-ghost:hover { background: var(--border-color); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { filter: brightness(0.92); }

  .settings-section { margin-bottom: 22px; }
  .settings-section-title { font-size: 12px; font-weight: 700; color: var(--text-tertiary); margin-bottom: 10px; }
  .divider-line { height: 1px; background: var(--border-color); margin: 14px 0; }

  .segmented {
    display: flex; background: var(--bg-app); border: 1px solid var(--border-color);
    border-radius: var(--radius-sm); padding: 3px; gap: 3px;
  }

  .segmented button {
    flex: 1; padding: 9px 6px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
    color: var(--text-secondary);
    transition: background var(--transition), color var(--transition);
  }

  .segmented button.active { background: var(--bg-panel); color: var(--accent); box-shadow: var(--shadow-sm); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .toggle-row-text { display: flex; flex-direction: column; gap: 2px; }
  .toggle-row-title { font-size: 13.5px; font-weight: 600; }
  .toggle-row-sub { font-size: 11.5px; color: var(--text-tertiary); }

  .switch {
    position: relative; width: 42px; height: 24px; border-radius: 20px;
    background: var(--border-color); flex-shrink: 0; transition: background var(--transition);
  }

  .switch.on { background: var(--accent); }

  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform var(--transition); box-shadow: var(--shadow-sm);
  }

  .switch.on::after { transform: translateX(18px); }

  .toast-container {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 300; align-items: center;
  }

  .toast {
    display: flex; align-items: center; gap: 10px; padding: 13px 18px;
    background: var(--text-primary); color: var(--bg-panel);
    border-radius: var(--radius-md); font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-lg);
    animation: toast-in 220ms cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  [data-theme="dark"] .toast { background: var(--bg-panel); color: var(--text-primary); border: 1px solid var(--border-color); }
  .toast.success svg { color: #3182F6; }
  .toast.error svg { color: #FF6B76; }
  .toast svg { width: 17px; height: 17px; flex-shrink: 0; }

  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .overlay-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 30; }

  @media (max-width: 980px) {
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh;
      transform: translateX(-100%); box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: translateX(0); }
    .overlay-backdrop.open { display: block; }
    .mobile-menu-btn { display: flex; }
    .list-panel { width: 100%; }
    .app-shell.show-editor .list-panel { display: none; }
    .editor-panel { display: none; position: fixed; inset: 0; z-index: 20; }
    .app-shell.show-editor .editor-panel { display: flex; }
    .mobile-back-btn { display: flex; }
    .editor-header { padding: 16px 18px 0 18px; }
    .toolbar { padding: 8px 18px; }
    .editor-scroll { padding: 18px 18px 30px 18px; }
    .editor-meta { padding: 10px 18px 14px 18px; }
    .title-input { font-size: 23px; }
  }

  @media (min-width: 981px) { .mobile-back-btn { display: none; } }
</style>
</head>
<body>

<div class="app-shell" id="appShell">

  <div class="overlay-backdrop" id="overlayBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div class="brand-name">Notebook</div>
    </div>

    <button class="new-note-btn" id="newNoteBtn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span>New Note</span>
    </button>

    <div class="search-box">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search">
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="all">
        <span class="nav-item-left">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><path d="M14 2v6h6"/></svg>
          <span>All Notes</span>
        </span>
        <span class="nav-count" id="countAll">0</span>
      </button>
      <button class="nav-item" data-view="favorites">
        <span class="nav-item-left">
          <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Favorites</span>
        </span>
        <span class="nav-count" id="countFavorites">0</span>
      </button>
      <button class="nav-item" data-view="trash">
        <span class="nav-item-left">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Trash</span>
        </span>
        <span class="nav-count" id="countTrash">0</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" id="settingsBtn">
        <span class="nav-item-left">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span>Settings</span>
        </span>
      </button>
    </div>
  </aside>

  <section class="list-panel">
    <div class="list-header">

        <button class="toolbar-btn" data-cmd="italic" title="Italic"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>

        <button class="toolbar-btn" data-block="h2" title="Subheading"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></svg></button>
        <button class="toolbar-btn" data-block="p" title="Normal Text"><svg class="icon" viewBox="0 0 24 24"><path d="M13 4v16"/><path d="M17 4v16"/><path d="M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/></svg></button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" data-cmd="insertUnorderedList" title="List"><svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
        <button class="toolbar-btn" data-cmd="insertOrderedList" title="Numbered List"><svg class="icon" viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
        <button class="toolbar-btn" data-block="blockquote" title="Quote"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg></button>
        <button class="toolbar-btn" data-block="pre" title="Code Block"><svg class="icon" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
        <button class="toolbar-btn" data-action="link" title="Link"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" data-cmd="undo" title="Undo"><svg class="icon" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></button>
        <button class="toolbar-btn" data-cmd="redo" title="Redo"><svg class="icon" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg></button>
      </div>

      <div class="editor-scroll">
        <div class="content-editable" id="contentEditable" contenteditable="true" data-placeholder="Start writing your content..."></div>
      </div>

      <div class="editor-meta">
        <div class="meta-item"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span id="metaCreated">-</span></div>
        <div class="meta-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="metaUpdated">-</span></div>
      </div>
    </div>
  </main>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  "use strict";

  const STORAGE_KEYS = {
    notes: "notebook_notes",
    settings: "notebook_settings"
  };

  let storageAvailable = true;
  try {
    const testKey = "__notebook_test__";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
  } catch (error) {
    storageAvailable = false;
  }

  function safeGetItem(key) {
    if (!storageAvailable) return null;
    try {
      return window.localStorage.getItem(key);
    } catch (error) {
      return null;
    }
  }

  function safeSetItem(key, value) {
    if (!storageAvailable) return false;
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (error) {
      return false;
    }
  }

  function generateId() {
    return "note_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
  }

  function loadNotes() {
    const raw = safeGetItem(STORAGE_KEYS.notes);
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed;
    } catch (error) {
      return [];
    }
  }

  function saveNotes(notes) {
    safeSetItem(STORAGE_KEYS.notes, JSON.stringify(notes));
  }

  function loadSettings() {
    const raw = safeGetItem(STORAGE_KEYS.settings);
    const defaults = { theme: "system", autoSave: true };
    if (!raw) return defaults;
    try {
      const parsed = JSON.parse(raw);
      return Object.assign({}, defaults, parsed);
    } catch (error) {
      return defaults;
    }
  }

  function saveSettings(settings) {
    safeSetItem(STORAGE_KEYS.settings, JSON.stringify(settings));
  }

  const state = {
    notes: loadNotes(),
    settings: loadSettings(),
    currentView: "all",
    activeNoteId: null,
    searchQuery: "",
    saveTimer: null,
    pendingDeleteAction: null
  };

  function formatDate(timestamp) {
    if (!timestamp) return "-";
    const date = new Date(timestamp);
    const day = String(date.getDate()).padStart(2, "0");
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const month = months[date.getMonth()];
    const year = date.getFullYear();
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    return day + " " + month + " " + year + ", " + hours + ":" + minutes;
  }

  function stripHtml(html) {
    const temp = document.createElement("div");
    temp.innerHTML = html || "";
    return (temp.textContent || temp.innerText || "").trim();
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  const TOAST_ICONS = {
    success: '<svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  };

  function showToast(message, type) {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    toast.className = "toast " + (type || "default");
    toast.innerHTML = (TOAST_ICONS[type] || TOAST_ICONS.success) + "<span></span>";
    toast.querySelector("span").textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transform = "translateY(6px)";
      toast.style.transition = "opacity 200ms, transform 200ms";
      setTimeout(() => toast.remove(), 220);
    }, 2400);
  }

  function applyTheme() {
    const theme = state.settings.theme;
    let resolved = theme;
    if (theme === "system") {
      resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    if (resolved === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    document.querySelectorAll("#themeSegmented button").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.themeValue === theme);
    });
  }

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (state.settings.theme === "system") applyTheme();
  });

  function getNoteById(id) {
    return state.notes.find((note) => note.id === id) || null;
  }

  function getFilteredNotes() {
    let list = state.notes.slice();

    if (state.currentView === "trash") {
      list = list.filter((note) => note.deleted);
    } else {
      list = list.filter((note) => !note.deleted);
      if (state.currentView === "favorites") {
        list = list.filter((note) => note.favorite);
      }
    }

    const query = state.searchQuery.trim().toLowerCase();
    if (query) {
      list = list.filter((note) => {
        const titleMatch = (note.title || "").toLowerCase().includes(query);
        const bodyMatch = stripHtml(note.content || "").toLowerCase().includes(query);
        return titleMatch || bodyMatch;
      });
    }

    list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    return list;
  }

  function updateCounts() {
    const activeNotes = state.notes.filter((note) => !note.deleted);
    document.getElementById("countAll").textContent = activeNotes.length;
    document.getElementById("countFavorites").textContent = activeNotes.filter((note) => note.favorite).length;
    document.getElementById("countTrash").textContent = state.notes.filter((note) => note.deleted).length;
  }

  const STAR_ICON = '<svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  const EMPTY_LIST_ICONS = {
    "search-x": '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/></svg>',
    "trash": '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    "star": STAR_ICON,
    "file": '<svg class="icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><path d="M14 2v6h6"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>'
  };

  function renderNoteList() {
    updateCounts();
    const listEl = document.getElementById("noteList");
    const notes = getFilteredNotes();

    const titles = { all: "All Notes", favorites: "Favorites", trash: "Trash" };
    document.getElementById("listTitle").textContent = titles[state.currentView];
    document.getElementById("listSub").textContent = notes.length + " notes";

    listEl.innerHTML = "";

    if (notes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-list";
      let message = "No results found";
      let iconKey = "search-x";
      if (!state.searchQuery.trim()) {
        if (state.currentView === "trash") {
          message = "Trash is empty";
          iconKey = "trash";
        } else if (state.currentView === "favorites") {
          message = "You have no favorite notes";
          iconKey = "star";
        } else {
          message = "No notes yet";
          iconKey = "file";
        }
      }
      empty.innerHTML =
        EMPTY_LIST_ICONS[iconKey] +
        '<div class="empty-list-title">' + escapeHtml(message) + '</div>' +
        '<div class="empty-list-sub">' + (state.currentView === "trash" ? "" : "Create a new note to get started.") + '</div>';
      listEl.appendChild(empty);
      return;
    }

    notes.forEach((note) => {
      const item = document.createElement("div");
      item.className = "note-item" + (note.id === state.activeNoteId ? " active" : "");
      item.dataset.id = note.id;

      const preview = stripHtml(note.content || "") || "No content";
      const displayTitle = note.title && note.title.trim() ? note.title : "Untitled Note";

      item.innerHTML =
        '<div class="note-item-top">' +
          '<div class="note-item-title"></div>' +
          (state.currentView !== "trash"
            ? '<button class="note-item-star' + (note.favorite ? " starred" : "") + '">' + STAR_ICON + '</button>'
            : "") +
        '</div>' +
        '<div class="note-item-preview"></div>' +
        '<div class="note-item-date"></div>';

      item.querySelector(".note-item-title").textContent = displayTitle;
      item.querySelector(".note-item-preview").textContent = preview;
      item.querySelector(".note-item-date").textContent = formatDate(note.updatedAt);

      item.addEventListener("click", (event) => {
        if (event.target.closest(".note-item-star")) return;
        selectNote(note.id);
      });

      const starBtn = item.querySelector(".note-item-star");
      if (starBtn) {
        starBtn.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleFavorite(note.id);
        });
      }

      listEl.appendChild(item);
    });
  }

  function selectNote(id) {
    state.activeNoteId = id;
    renderNoteList();
    renderEditor();
    if (window.innerWidth <= 980) {
      document.getElementById("appShell").classList.add("show-editor");
    }
  }

  function renderEditor() {
    const note = getNoteById(state.activeNoteId);
    const emptyState = document.getElementById("editorEmptyState");
    const editorContent = document.getElementById("editorContent");

    if (!note) {
      emptyState.style.display = "flex";
      editorContent.style.display = "none";
      document.getElementById("appShell").classList.remove("show-editor");
      return;
    }

    emptyState.style.display = "none";
    editorContent.style.display = "flex";

    document.getElementById("titleInput").value = note.title || "";
    document.getElementById("contentEditable").innerHTML = note.content || "";
    document.getElementById("metaCreated").textContent = "Created: " + formatDate(note.createdAt);
    document.getElementById("metaUpdated").textContent = "Updated: " + formatDate(note.updatedAt);

    const favBtn = document.getElementById("favoriteBtn");
    favBtn.classList.toggle("active-toggle", !!note.favorite);

    const isTrashed = !!note.deleted;
    document.getElementById("titleInput").disabled = isTrashed;
    document.getElementById("contentEditable").setAttribute("contenteditable", isTrashed ? "false" : "true");
    document.getElementById("favoriteBtn").style.visibility = isTrashed ? "hidden" : "visible";

    const deleteBtn = document.getElementById("deleteNoteBtn");
    deleteBtn.innerHTML = isTrashed
      ? '<svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>'
      : '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    deleteBtn.title = isTrashed ? "Restore" : "Delete";

    setSaveStatus("saved");
  }

  function setSaveStatus(status) {
    const el = document.getElementById("saveStatus");
    const textEl = document.getElementById("saveStatusText");
    el.classList.remove("saving", "saved");
    if (status === "saving") {
      el.classList.add("saving");
      textEl.textContent = "Saving...";
    } else {
      el.classList.add("saved");
      textEl.textContent = "Saved";
    }
  }

  function createNote() {
    const now = Date.now();
    const note = {
      id: generateId(),
      title: "",
      content: "",
      favorite: false,
      deleted: false,
      createdAt: now,
      updatedAt: now
    };
    state.notes.unshift(note);
    saveNotes(state.notes);
    state.currentView = "all";
    document.querySelectorAll(".nav-item[data-view]").forEach((item) => {
      item.classList.toggle("active", item.dataset.view === "all");
    });
    renderNoteList();
    selectNote(note.id);
    document.getElementById("titleInput").focus();
  }

  function persistActiveNote() {
    const note = getNoteById(state.activeNoteId);
    if (!note || note.deleted) return;
    setSaveStatus("saving");
    const titleEl = document.getElementById("titleInput");
    const contentEl = document.getElementById("contentEditable");
    note.title = titleEl.value;
    note.content = contentEl.innerHTML;
    note.updatedAt = Date.now();
    saveNotes(state.notes);
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      setSaveStatus("saved");
      renderNoteList();
    }, 420);
  }

  function toggleFavorite(id) {
    const note = getNoteById(id);
    if (!note) return;
    note.favorite = !note.favorite;
    saveNotes(state.notes);
    renderNoteList();
    if (id === state.activeNoteId) renderEditor();
    showToast(note.favorite ? "Added to favorites" : "Removed from favorites", "success");
  }

  function moveToTrash(id) {
    const note = getNoteById(id);
    if (!note) return;
    note.deleted = true;
    note.deletedAt = Date.now();
    saveNotes(state.notes);
    if (state.activeNoteId === id) state.activeNoteId = null;
    renderNoteList();
    renderEditor();
    showToast("Moved to trash", "success");
  }

  function restoreNote(id) {
    const note = getNoteById(id);
    if (!note) return;
    note.deleted = false;
    delete note.deletedAt;
    saveNotes(state.notes);
    renderNoteList();
    renderEditor();
    showToast("Note restored", "success");
  }

  function permanentlyDeleteNote(id) {
    state.notes = state.notes.filter((note) => note.id !== id);
    saveNotes(state.notes);
    if (state.activeNoteId === id) state.activeNoteId = null;
    renderNoteList();
    renderEditor();
    showToast("Permanently deleted", "success");
  }

  function purgeExpiredTrash() {
    const now = Date.now();
    const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
    const before = state.notes.length;
    state.notes = state.notes.filter((note) => {
      if (!note.deleted) return true;
      if (!note.deletedAt) return true;
      return now - note.deletedAt < thirtyDaysMs;
    });
    if (state.notes.length !== before) {
      saveNotes(state.notes);
    }
  }

  function openConfirm(title, desc, onConfirm) {
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmDesc").textContent = desc;
    state.pendingDeleteAction = onConfirm;
    document.getElementById("confirmModal").classList.add("open");
  }

  function closeConfirm() {
    document.getElementById("confirmModal").classList.remove("open");
    state.pendingDeleteAction = null;
  }

  function handleDeleteButtonClick() {
    const note = getNoteById(state.activeNoteId);
    if (!note) return;
    if (note.deleted) {
      openConfirm(
        "Delete Permanently",
        "Are you sure you want to permanently delete this note? This action cannot be undone.",
        () => permanentlyDeleteNote(note.id)
      );
    } else {
      openConfirm(
        "Move to Trash",
        "Are you sure you want to move this note to the trash? You can restore it later.",
        () => moveToTrash(note.id)
      );
    }
  }

  function seedInitialNote() {
    if (state.notes.length > 0) return;
    const now = Date.now();
    state.notes.push({
      id: generateId(),
      title: "Welcome to Notebook",
      content:
        "<h1>Getting Started</h1>" +
        "<p>Write your thoughts here freely. Click the <b>New Note</b> button in the top left to create a new note.</p>" +
        "<h2>Key Features</h2>" +
        "<ul><li>Real-time autosave</li><li>Favorites and trash management</li><li>Search by title and content</li><li>Rich text editing tools</li></ul>" +
        "<blockquote>Instead of deleting a note right away, it's moved to the trash first — you can restore it from there if you change your mind.</blockquote>" +
        "<p>Happy note-taking.</p>",
      favorite: true,
      deleted: false,
      createdAt: now,
      updatedAt: now
    });
    saveNotes(state.notes);
  }

  function initToolbar() {
    document.querySelectorAll(".toolbar-btn[data-cmd]").forEach((btn) => {
      btn.addEventListener("mousedown", (event) => event.preventDefault());
      btn.addEventListener("click", () => {
        document.execCommand(btn.dataset.cmd, false, null);
        document.getElementById("contentEditable").focus();
        persistActiveNote();
      });
    });

    document.querySelectorAll(".toolbar-btn[data-block]").forEach((btn) => {
      btn.addEventListener("mousedown", (event) => event.preventDefault());
      btn.addEventListener("click", () => {
        const tag = btn.dataset.block;
        document.execCommand("formatBlock", false, tag === "p" ? "P" : tag.toUpperCase());
        document.getElementById("contentEditable").focus();
        persistActiveNote();
      });
    });

    document.querySelector('.toolbar-btn[data-action="link"]').addEventListener("mousedown", (event) => event.preventDefault());
    document.querySelector('.toolbar-btn[data-action="link"]').addEventListener("click", () => {
      const url = window.prompt("Enter a link URL");
      if (url) {
        document.execCommand("createLink", false, url);
        document.getElementById("contentEditable").focus();
        persistActiveNote();
      }
    });
  }

  function openSettingsModal() {
    document.getElementById("autoSaveToggle").classList.toggle("on", state.settings.autoSave);
    applyTheme();
    document.getElementById("settingsModal").classList.add("open");
  }

  function closeSettingsModal() {
    document.getElementById("settingsModal").classList.remove("open");
  }

  function initEventListeners() {
    document.getElementById("newNoteBtn").addEventListener("click", createNote);

    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.searchQuery = event.target.value;
      renderNoteList();
    });

    document.querySelectorAll(".nav-item[data-view]").forEach((item) => {
      item.addEventListener("click", () => {
        state.currentView = item.dataset.view;
        document.querySelectorAll(".nav-item[data-view]").forEach((el) => el.classList.remove("active"));
        item.classList.add("active");
        renderNoteList();
        closeMobileSidebar();
      });
    });

    document.getElementById("titleInput").addEventListener("input", () => {
      if (state.settings.autoSave) persistActiveNote();
    });

    document.getElementById("contentEditable").addEventListener("input", () => {
      if (state.settings.autoSave) persistActiveNote();
    });

    document.getElementById("favoriteBtn").addEventListener("click", () => {
      if (state.activeNoteId) toggleFavorite(state.activeNoteId);
    });

    document.getElementById("deleteNoteBtn").addEventListener("click", handleDeleteButtonClick);

    document.getElementById("settingsBtn").addEventListener("click", openSettingsModal);
    document.getElementById("settingsCloseBtn").addEventListener("click", closeSettingsModal);
    document.getElementById("settingsModal").addEventListener("click", (event) => {
      if (event.target.id === "settingsModal") closeSettingsModal();
    });

    document.querySelectorAll("#themeSegmented button").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.settings.theme = btn.dataset.themeValue;
        saveSettings(state.settings);
        applyTheme();
      });
    });

    document.getElementById("autoSaveToggle").addEventListener("click", () => {
      state.settings.autoSave = !state.settings.autoSave;
      saveSettings(state.settings);
      document.getElementById("autoSaveToggle").classList.toggle("on", state.settings.autoSave);
    });

    document.getElementById("confirmCancelBtn").addEventListener("click", closeConfirm);
    document.getElementById("confirmModal").addEventListener("click", (event) => {
      if (event.target.id === "confirmModal") closeConfirm();
    });
    document.getElementById("confirmOkBtn").addEventListener("click", () => {
      if (typeof state.pendingDeleteAction === "function") state.pendingDeleteAction();
      closeConfirm();
    });

    document.getElementById("mobileMenuBtn").addEventListener("click", openMobileSidebar);
    document.getElementById("overlayBackdrop").addEventListener("click", closeMobileSidebar);

    document.getElementById("mobileBackBtn").addEventListener("click", () => {
      document.getElementById("appShell").classList.remove("show-editor");
    });

    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "s") {
        event.preventDefault();
        persistActiveNote();
      }
      if (event.key === "Escape") {
        closeSettingsModal();
        closeConfirm();
      }
    });

    initToolbar();
  }

  function openMobileSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlayBackdrop").classList.add("open");
  }

  function closeMobileSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlayBackdrop").classList.remove("open");
  }

  function init() {
    seedInitialNote();
    purgeExpiredTrash();
    applyTheme();
    initEventListeners();
    renderNoteList();
    renderEditor();

    if (!storageAvailable) {
      showToast("Browser storage is unavailable, changes may not be saved", "error");
    }
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
